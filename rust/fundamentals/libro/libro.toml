# Manifiesto del libro: portada, secciones y capítulos.
# Un capítulo sin `archivo` está pendiente: aparece en el índice, sin página.

titulo = "Rust"
subtitulo = "Cuaderno de campo"
edicion = "2ª edición"
autor = "Giovanny Alfonso Chávez Ceniceros"
idioma = "es"
descripcion = """
Rust promete programas rápidos y sin errores de memoria, y cobra esa promesa \
con ideas que no existen en otros lenguajes: ownership, préstamos, lifetimes. \
Este cuaderno las recorre en orden, de los tokens a un servidor asíncrono, sin \
usar nada antes de explicarlo."""
descripcion2 = """
Cada capítulo sigue el mismo camino: el problema, las reglas, una figura, las \
reglas una por una con los errores reales del compilador, y un ejemplo de \
aplicación."""
prefacio = "src/0-preliminares/prefacio.md"
agradecimientos = "src/0-preliminares/agradecimientos.md"
referencias = "src/0-preliminares/referencias.md"

