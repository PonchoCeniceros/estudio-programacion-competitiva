<figure class="diagrama">
<figcaption><span class="titulo">La misma carga, dos veces</span><span class="pie">Tres peticiones que casi todo el tiempo esperan. Arriba, cada espera ocupa un hilo. Abajo, un solo hilo atiende los tramos activos de las tres.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" role="img" aria-label="Arriba, tres hilos: cada uno atiende una petición y pasa casi toda su barra esperando. Abajo, un solo hilo ejecuta uno tras otro los tramos activos de tres tareas; mientras esperan, las tareas quedan apartadas y el hilo queda libre.">

<g class="r-dueno"><rect class="caja" x="70" y="22" width="30" height="22" rx="6"/><text class="val" x="85" y="37">A</text><rect class="caja" x="370" y="22" width="30" height="22" rx="6"/><text class="val" x="385" y="37">A</text></g>
<text class="tit" x="0" y="65">hilo 2</text>
<g class="r-movido"><rect class="caja" x="130" y="50" width="270" height="22" rx="6"/><text class="nota" x="265" y="65" text-anchor="middle">esperando: no calcula nada</text></g>
<g class="r-ref"><rect class="caja" x="100" y="50" width="30" height="22" rx="6"/><text class="val" x="115" y="65">B</text><rect class="caja" x="400" y="50" width="30" height="22" rx="6"/><text class="val" x="415" y="65">B</text></g>
<text class="tit" x="0" y="93">hilo 3</text>
<g class="r-movido"><rect class="caja" x="160" y="78" width="270" height="22" rx="6"/><text class="nota" x="295" y="93" text-anchor="middle">esperando: no calcula nada</text></g>
<g class="r-heap"><rect class="caja" x="130" y="78" width="30" height="22" rx="6"/><text class="val" x="145" y="93">C</text><rect class="caja" x="430" y="78" width="30" height="22" rx="6"/><text class="val" x="445" y="93">C</text></g>
<text class="nota" x="265" y="122" text-anchor="middle">tres stacks reservados; el sistema operativo alterna entre los tres hilos</text>
