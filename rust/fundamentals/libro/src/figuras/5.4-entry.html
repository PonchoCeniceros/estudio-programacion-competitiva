<figure class="diagrama">
<figcaption><span class="titulo">Las dos ramas de entry(...).or_insert(0)</span><span class="pie">La misma línea cuenta una palabra nueva y una repetida. Solo cambia si or_insert inserta o no.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 348" role="img" aria-label="Con la llave nueva pez, or_insert inserta 0 y devuelve una referencia mutable a ese 0, que pasa a 1. Con la llave existente el, or_insert no inserta y devuelve una referencia mutable al 2, que pasa a 3.">
<text class="col" x="28" y="12">PASO</text><text class="col" x="205" y="12">CONTEO</text><text class="col" x="440" y="12">DEVUELVE</text>
<text class="tit" x="28" y="34">Llave nueva: &quot;pez&quot;</text>
<g class="num"><circle cx="10" cy="62" r="9"/><text x="10" y="66">1</text></g><text class="cod" x="28" y="58">conteo.entry(&quot;pez&quot;)</text><text class="nota" x="28" y="74">busca la llave: no está</text>
<g class="r-dueno"><rect class="caja" x="205" y="44" width="210" height="36" rx="6"/><rect class="celda" x="213" y="50" width="62" height="24" rx="3"/><text class="val" x="244" y="66">gato: 1</text><rect class="celda" x="279" y="50" width="62" height="24" rx="3"/><text class="val" x="310" y="66">el: 2</text></g>
<g class="r-neutro"><rect class="caja" x="440" y="50" width="72" height="24" rx="6"/><text class="val" x="476" y="66">Entry</text></g>
<g class="num"><circle cx="10" cy="108" r="9"/><text x="10" y="112">2</text></g><text class="cod" x="28" y="104">.or_insert(0)</text><text class="nota" x="28" y="120">inserta 0 y devuelve &amp;mut</text>
<g class="r-dueno"><rect class="caja" x="205" y="90" width="210" height="36" rx="6"/><rect class="celda" x="213" y="96" width="62" height="24" rx="3"/><text class="val" x="244" y="112">gato: 1</text><rect class="celda" x="279" y="96" width="62" height="24" rx="3"/><text class="val" x="310" y="112">el: 2</text><rect class="celda" x="345" y="96" width="62" height="24" rx="3" style="fill:#dbe7f3; stroke:#2f5f8f"/><text class="val" x="376" y="112">pez: 0</text></g>
<g class="r-ref"><rect class="caja" x="440" y="96" width="72" height="24" rx="6"/><text class="val" x="476" y="112">&amp;mut</text></g>
<path class="fl-ref" d="M440,108 H415"/><polygon class="pt-ref" points="408,108 416,104 416,112"/>
<g class="num"><circle cx="10" cy="154" r="9"/><text x="10" y="158">3</text></g><text class="cod" x="28" y="150">*… += 1</text><text class="nota" x="28" y="166">suma 1 a través del &amp;mut</text>
<g class="r-dueno"><rect class="caja" x="205" y="136" width="210" height="36" rx="6"/><rect class="celda" x="213" y="142" width="62" height="24" rx="3"/><text class="val" x="244" y="158">gato: 1</text><rect class="celda" x="279" y="142" width="62" height="24" rx="3"/><text class="val" x="310" y="158">el: 2</text><rect class="celda" x="345" y="142" width="62" height="24" rx="3"/><text class="val" x="376" y="158">pez: 1</text></g>
<text class="tit" x="28" y="200">Llave existente: &quot;el&quot;</text>
<g class="num"><circle cx="10" cy="228" r="9"/><text x="10" y="232">1</text></g><text class="cod" x="28" y="224">conteo.entry(&quot;el&quot;)</text><text class="nota" x="28" y="240">busca la llave: ya está</text>
<g class="r-dueno"><rect class="caja" x="205" y="210" width="210" height="36" rx="6"/><rect class="celda" x="213" y="216" width="62" height="24" rx="3"/><text class="val" x="244" y="232">gato: 1</text><rect class="celda" x="279" y="216" width="62" height="24" rx="3"/><text class="val" x="310" y="232">el: 2</text></g>
<g class="r-neutro"><rect class="caja" x="440" y="216" width="72" height="24" rx="6"/><text class="val" x="476" y="232">Entry</text></g>
<g class="num"><circle cx="10" cy="274" r="9"/><text x="10" y="278">2</text></g><text class="cod" x="28" y="270">.or_insert(0)</text><text class="nota" x="28" y="286">no inserta: el 0 se ignora</text>
<g class="r-dueno"><rect class="caja" x="205" y="256" width="210" height="36" rx="6"/><rect class="celda" x="213" y="262" width="62" height="24" rx="3"/><text class="val" x="244" y="278">gato: 1</text><rect class="celda" x="279" y="262" width="62" height="24" rx="3" style="fill:#dbe7f3; stroke:#2f5f8f"/><text class="val" x="310" y="278">el: 2</text></g>
<g class="r-ref"><rect class="caja" x="440" y="262" width="72" height="24" rx="6"/><text class="val" x="476" y="278">&amp;mut</text></g>
<path class="fl-ref" d="M440,274 H349"/><polygon class="pt-ref" points="342,274 350,270 350,278"/>
<g class="num"><circle cx="10" cy="320" r="9"/><text x="10" y="324">3</text></g><text class="cod" x="28" y="316">*… += 1</text><text class="nota" x="28" y="332">el 2 pasa a 3</text>
<g class="r-dueno"><rect class="caja" x="205" y="302" width="210" height="36" rx="6"/><rect class="celda" x="213" y="308" width="62" height="24" rx="3"/><text class="val" x="244" y="324">gato: 1</text><rect class="celda" x="279" y="308" width="62" height="24" rx="3"/><text class="val" x="310" y="324">el: 3</text></g>
</svg>
</figure>
