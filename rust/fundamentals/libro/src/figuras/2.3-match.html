<figure class="diagrama">
<figcaption><span class="titulo">Un match, rama por rama</span><span class="pie">Las ramas se prueban en orden. La primera que encaja extrae los datos y las demás ya no se prueban.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 262" role="img" aria-label="El valor Mensaje::Mover con x 3 y y menos 1 no encaja en la rama Salir, encaja en la rama Mover, que extrae x igual a 3 y y igual a menos 1; las ramas Escribir y CambiarColor no se prueban.">
<text class="col" x="28" y="12">VALOR</text>
<g class="r-dueno"><rect class="caja" x="28" y="20" width="300" height="30" rx="6"/><text class="val" x="178" y="40">Mensaje::Mover { x: 3, y: -1 }</text></g>
<path class="fl-dueno" d="M178,50 V68"/><polygon class="pt-dueno" points="178,75 174,67 182,67"/>
<text class="col" x="345" y="70">QUÉ PASA</text>
<g class="num"><circle cx="10" cy="95" r="9"/><text x="10" y="99">1</text></g>
<rect class="panel" x="28" y="80" width="300" height="30" rx="6"/>
<text class="cod" x="40" y="99">Mensaje::Salir =&gt; …</text>
<text class="nota" x="345" y="99">no encaja: es otra variante</text>
<g class="num"><circle cx="10" cy="135" r="9"/><text x="10" y="139">2</text></g>
<g class="r-dueno"><rect class="caja" x="28" y="120" width="300" height="30" rx="6"/><text class="cod" x="40" y="139">Mensaje::Mover { x, y } =&gt; …</text>
<rect class="celda" x="345" y="123" width="66" height="24" rx="3"/><text class="val" x="378" y="139">x = 3</text>
<rect class="celda" x="419" y="123" width="66" height="24" rx="3"/><text class="val" x="452" y="139">y = -1</text></g>
<g class="num"><circle cx="10" cy="175" r="9"/><text x="10" y="179">3</text></g>
<g class="r-movido"><rect class="caja" x="28" y="160" width="300" height="30" rx="6"/></g>
<text class="cod" x="40" y="179" style="fill: #9aa3a4">Mensaje::Escribir(t) =&gt; …</text>
<text class="nota" x="345" y="179">no se prueba</text>
<g class="num"><circle cx="10" cy="215" r="9"/><text x="10" y="219">4</text></g>
<g class="r-movido"><rect class="caja" x="28" y="200" width="300" height="30" rx="6"/></g>
<text class="cod" x="40" y="219" style="fill: #9aa3a4">Mensaje::CambiarColor(r, g, b) =&gt; …</text>
<text class="nota" x="345" y="219">no se prueba</text>
<text class="nota" x="28" y="254">La rama 2 se ejecuta con x y y ya asignadas: imprime «mover 3,-1».</text>
</svg>
</figure>
