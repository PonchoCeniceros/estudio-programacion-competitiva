<figure class="diagrama">
<figcaption><span class="titulo">i8 y u8: los mismos 256 valores</span><span class="pie">Los dos tipos tienen 8 bits y 2⁸ = 256 valores. El de signo empieza en −128; el sin signo, en 0.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 172" role="img" aria-label="Dos barras del mismo largo. La de i8 va de -128 a 127 con el cero al centro; la de u8 va de 0 a 255 y empieza donde i8 tiene el cero.">
<path class="fl-neutro" d="M200 10 L200 74 M200 90 L200 140" style="stroke-dasharray: 4 3"/>
<text class="nota" x="206" y="20">cero</text>
<text class="col" x="0" y="58">I8</text>
<g class="r-ref"><rect class="caja" x="40" y="38" width="320" height="30" rx="6"/><text class="val" x="120" y="58">negativos</text><text class="val" x="280" y="58">positivos</text></g>
<text class="idx" x="40" y="84">−128</text><text class="idx" x="200" y="84">0</text><text class="idx" x="360" y="84">127</text>
<text class="col" x="0" y="124">U8</text>
<g class="r-dueno"><rect class="caja" x="200" y="104" width="320" height="30" rx="6"/><text class="val" x="360" y="124">solo de 0 hacia arriba</text></g>
<text class="idx" x="200" y="150">0</text><text class="idx" x="360" y="150">128</text><text class="idx" x="512" y="150">255</text>
<text class="nota" x="30" y="122">u8 no tiene negativos:</text>
<text class="nota" x="30" y="138">a cambio llega a 255</text>
</svg>
</figure>
