<figcaption><span class="titulo">Dos errores, un tipo</span><span class="pie">Cada ? convierte el error de su operación con el From que le corresponde. El error que la función construye ya tiene el tipo y no pasa por conversión.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 244" role="img" aria-label="Tres orígenes de error entran al enum ErrorPedido: el ? sobre el parse de u32 entra por From de ParseIntError a la variante Cantidad, el ? sobre el parse de f64 entra por From de ParseFloatError a la variante Precio, y el Err(CantidadCero) entra sin conversión. El enum es el tipo de error del Result que devuelve total.">

<g class="num"><circle cx="10" cy="105" r="9"/><text x="10" y="109">2</text></g>
