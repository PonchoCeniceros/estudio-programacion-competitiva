<figure class="diagrama">
<figcaption><span class="titulo">El orden de Drop</span><span class="pie">Cada barra es la vida de un valor. Al cerrar el scope se destruyen en orden inverso al de declaración.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 196" role="img" aria-label="Tres valores declarados en el orden a, b, c se destruyen al cerrar el scope en el orden c, b, a.">
<text class="col" x="28" y="12">SE DECLARAN</text><text class="col" x="322" y="12">SE DESTRUYEN</text>
<path class="fl-neutro" d="M300,22 V156" stroke-dasharray="4 4"/>
<text class="cod" x="300" y="172" text-anchor="middle">}</text>
<text class="nota" x="312" y="172">cierra el scope</text>
<g class="num"><circle cx="10" cy="46" r="9"/><text x="10" y="50">1</text></g><text class="cod" x="28" y="50">let _a</text>
<g class="r-dueno"><rect class="caja" x="130" y="34" width="290" height="24" rx="6"/><text class="tit" x="142" y="50">a</text></g>
<g class="num"><circle cx="434" cy="46" r="9"/><text x="434" y="50">6</text></g><text class="cod" x="448" y="50">suelto a</text>
<g class="num"><circle cx="10" cy="86" r="9"/><text x="10" y="90">2</text></g><text class="cod" x="28" y="90">let _b</text>
<g class="r-dueno"><rect class="caja" x="175" y="74" width="195" height="24" rx="6"/><text class="tit" x="187" y="90">b</text></g>
<g class="num"><circle cx="384" cy="86" r="9"/><text x="384" y="90">5</text></g><text class="cod" x="398" y="90">suelto b</text>
<g class="num"><circle cx="10" cy="126" r="9"/><text x="10" y="130">3</text></g><text class="cod" x="28" y="130">let _c</text>
<g class="r-dueno"><rect class="caja" x="220" y="114" width="100" height="24" rx="6"/><text class="tit" x="232" y="130">c</text></g>
<g class="num"><circle cx="334" cy="126" r="9"/><text x="334" y="130">4</text></g><text class="cod" x="348" y="130">suelto c</text>
<text class="nota" x="28" y="190">c puede guardar referencias a b y a a: por eso se destruye antes que ellas.</text>
</svg>
</figure>
