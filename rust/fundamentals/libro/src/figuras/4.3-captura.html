<figure class="diagrama">
<figcaption><span class="titulo">Los tres modos de captura</span><span class="pie">Lo que el cuerpo hace con la variable decide qué guarda la closure y qué trait resulta.</span></figcaption>
<svg class="dg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 232" role="img" aria-label="Una closure que solo lee guarda una referencia compartida y es Fn. Una que modifica guarda una referencia exclusiva y es FnMut. Una que consume guarda el valor, deja movida la variable y es FnOnce.">
<g class="p-ok"><rect class="panel" x="0.75" y="0.75" width="158.5" height="230.5" rx="6"/><text class="tit" x="80" y="22" text-anchor="middle">Solo lee</text><text class="cod" x="80" y="43" text-anchor="middle">|| s.len()</text><text class="col" x="80" y="66" text-anchor="middle">LA CLOSURE GUARDA</text><g class="r-ref"><rect class="caja" x="40.0" y="74" width="80" height="26" rx="6"/><text class="val" x="80" y="91">&amp;String</text></g><path class="fl-ref" d="M80,100 V136"/><polygon class="pt-ref" points="80,143 76,135 84,135"/><g class="r-dueno"><rect class="caja" x="22" y="146" width="116" height="30" rx="6"/><text class="val" x="80" y="165">s: String</text></g><text class="cod" x="80" y="200" text-anchor="middle">Fn</text><text class="nota" x="80" y="218" text-anchor="middle">se llama muchas veces</text></g>
<g class="p-ok"><rect class="panel" x="180.75" y="0.75" width="158.5" height="230.5" rx="6"/><text class="tit" x="260" y="22" text-anchor="middle">Modifica</text><text class="cod" x="260" y="43" text-anchor="middle">|| s.push('!')</text><text class="col" x="260" y="66" text-anchor="middle">LA CLOSURE GUARDA</text><g class="r-ref"><rect class="caja" x="205.0" y="74" width="110" height="26" rx="6"/><text class="val" x="260" y="91">&amp;mut String</text></g><path class="fl-ref" d="M260,100 V136"/><polygon class="pt-ref" points="260,143 256,135 264,135"/><g class="r-dueno"><rect class="caja" x="202" y="146" width="116" height="30" rx="6"/><text class="val" x="260" y="165">s: String</text></g><text class="cod" x="260" y="200" text-anchor="middle">FnMut</text><text class="nota" x="260" y="218" text-anchor="middle">muchas veces, de una en una</text></g>
<g class="p-ok"><rect class="panel" x="360.75" y="0.75" width="158.5" height="230.5" rx="6"/><text class="tit" x="440" y="22" text-anchor="middle">Consume</text><text class="cod" x="440" y="43" text-anchor="middle">|| s</text><text class="col" x="440" y="66" text-anchor="middle">LA CLOSURE GUARDA</text><g class="r-dueno"><rect class="caja" x="407.0" y="74" width="66" height="26" rx="6"/><text class="val" x="440" y="91">String</text></g><path class="fl-dueno" d="M440,146 V110"/><polygon class="pt-dueno" points="440,103 436,111 444,111"/><g class="r-movido"><rect class="caja" x="382" y="146" width="116" height="30" rx="6"/><text class="val" x="440" y="165">s: String</text></g><text class="cod" x="440" y="200" text-anchor="middle">FnOnce</text><text class="nota" x="440" y="218" text-anchor="middle">se llama una sola vez</text></g>
</svg>
</figure>
